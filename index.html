<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4a90d9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Finanças Familiar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, sans-serif; background: #f5f7fb; padding-bottom: 70px; }
    .header { background: linear-gradient(135deg, #4a90d9, #357abd); color: white; padding: 20px 16px; border-radius: 0 0 24px 24px; }
    .header h1 { font-size: 1.6rem; }
    .saldo-container { background: rgba(255,255,255,0.15); border-radius: 16px; padding: 12px; margin-top: 12px; }
    .saldo-valor { font-size: 1.8rem; font-weight: bold; }
    .tabs { display: flex; background: white; margin: 16px 16px 0; border-radius: 32px; overflow: hidden; }
    .tab { flex: 1; text-align: center; padding: 12px; background: none; border: none; font-weight: 600; color: #666; cursor: pointer; }
    .tab.active { background: #4a90d9; color: white; }
    .screen { display: none; padding: 16px; }
    .screen.active { display: block; }
    .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; color: #333; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 500; color: #555; font-size: 0.85rem; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 1rem; background: #fafafa; }
    .btn { width: 100%; padding: 14px; background: #4a90d9; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
    .btn:active { transform: scale(0.98); }
    .tipo-buttons { display: flex; gap: 12px; }
    .tipo-btn { flex: 1; padding: 12px; border: 2px solid #ddd; background: white; border-radius: 12px; font-weight: bold; cursor: pointer; }
    .tipo-btn.despesa.active { background: #e74c3c; border-color: #e74c3c; color: white; }
    .tipo-btn.receita.active { background: #2ecc71; border-color: #2ecc71; color: white; }
    .resumo-cards { display: flex; gap: 12px; margin-bottom: 16px; }
    .resumo-card { flex: 1; background: white; border-radius: 16px; padding: 12px; text-align: center; }
    .resumo-card.receitas { border-left: 4px solid #2ecc71; }
    .resumo-card.despesas { border-left: 4px solid #e74c3c; }
    .resumo-card.saldo { border-left: 4px solid #4a90d9; }
    .resumo-valor { font-size: 1.4rem; font-weight: bold; }
    .categoria-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    .lancamento-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
    .lancamento-descricao { font-weight: 500; }
    .lancamento-data { font-size: 0.7rem; color: #888; }
    .lancamento-valor.receita { color: #2ecc71; }
    .lancamento-valor.despesa { color: #e74c3c; }
    .filtro-row { display: flex; gap: 12px; margin-bottom: 16px; }
    .filtro-row select, .filtro-row input { flex: 1; }
    .error-msg { background: #fee; color: #c0392b; padding: 12px; border-radius: 12px; margin-bottom: 16px; }
    .success-msg { background: #e8f8e8; color: #27ae60; padding: 12px; border-radius: 12px; margin-bottom: 16px; }
    .config-card { background: #e8f0fe; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .config-card input { background: white; margin-bottom: 8px; }
    small { color: #666; font-size: 0.7rem; display: block; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>💰 Finanças Familiar</h1>
    <div class="saldo-container">
      <div>Saldo atual</div>
      <div class="saldo-valor" id="saldoHeaderValor">R$ 0,00</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-screen="lancar">➕ Lançar</button>
    <button class="tab" data-screen="relatorio">📊 Relatório</button>
    <button class="tab" data-screen="historico">📋 Histórico</button>
    <button class="tab" data-screen="config">⚙️ Config</button>
  </div>

  <!-- Tela Configuração (só aparece na primeira vez) -->
  <div id="screen-config" class="screen">
    <div class="card">
      <div class="card-title">🔧 Configuração do Airtable</div>
      <div id="config-mensagem"></div>
      
      <div class="form-group">
        <label>🔑 API Key do Airtable</label>
        <input type="password" id="apiKey" placeholder="keyXXXXXXXXXXXXXXXXXXXXXX">
        <small>Encontre em: airtable.com/account → Generate API key</small>
      </div>
      
      <div class="form-group">
        <label>📁 Base ID</label>
        <input type="text" id="baseId" placeholder="appXXXXXXXXXXXXXXXX">
        <small>Encontre em: airtable.com/api → clique na sua base</small>
      </div>
      
      <div class="form-group">
        <label>📋 Nome da Tabela</label>
        <input type="text" id="tableName" placeholder="Table 1">
        <small>O nome padrão é "Table 1" (você pode renomear)</small>
      </div>
      
      <button class="btn" id="btnSalvarConfig">💾 Salvar Configuração</button>
    </div>
  </div>

  <div id="screen-lancar" class="screen">
    <div class="card">
      <div class="card-title">📝 Novo Lançamento</div>
      <div id="lancar-mensagem"></div>
      <div class="form-group">
        <label>📅 Data</label>
        <input type="date" id="data">
      </div>
      <div class="form-group">
        <label>📌 Descrição</label>
        <input type="text" id="descricao" placeholder="Ex: Supermercado, Salário...">
      </div>
      <div class="form-group">
        <label>📂 Categoria</label>
        <select id="categoria">
          <option value="Alimentação">🍔 Alimentação</option>
          <option value="Transporte">🚗 Transporte</option>
          <option value="Saúde">🏥 Saúde</option>
          <option value="Lazer">🎬 Lazer</option>
          <option value="Moradia">🏠 Moradia</option>
          <option value="Assinaturas">📺 Assinaturas</option>
          <option value="Outros">📦 Outros</option>
        </select>
      </div>
      <div class="form-group">
        <label>💰 Valor (R$)</label>
        <input type="number" id="valor" step="0.01" placeholder="0,00">
      </div>
      <div class="form-group">
        <label>🔄 Tipo</label>
        <div class="tipo-buttons">
          <button type="button" class="tipo-btn despesa active" data-tipo="despesa">💸 Despesa</button>
          <button type="button" class="tipo-btn receita" data-tipo="receita">💚 Receita</button>
        </div>
      </div>
      <button class="btn" id="btnSalvar">💾 Salvar</button>
    </div>
  </div>

  <div id="screen-relatorio" class="screen">
    <div class="card">
      <div class="card-title">📈 Resumo do Mês</div>
      <div id="relatorio-mensagem"></div>
      <div class="filtro-row">
        <select id="mesFiltro">
          <option value="1">Janeiro</option><option value="2">Fevereiro</option>
          <option value="3">Março</option><option value="4">Abril</option>
          <option value="5">Maio</option><option value="6">Junho</option>
          <option value="7">Julho</option><option value="8">Agosto</option>
          <option value="9">Setembro</option><option value="10">Outubro</option>
          <option value="11">Novembro</option><option value="12">Dezembro</option>
        </select>
        <select id="anoFiltro">
          <option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option>
        </select>
        <button class="btn" id="btnAtualizarRelatorio" style="width: auto; padding: 12px 16px;">Atualizar</button>
      </div>
      <div id="resumo-container"></div>
      <div class="card-title" style="margin-top: 16px;">📊 Gastos por Categoria</div>
      <div id="categorias-container"></div>
    </div>
  </div>

  <div id="screen-historico" class="screen">
    <div class="card">
      <div class="card-title">📋 Lançamentos</div>
      <div id="historico-mensagem"></div>
      <div class="filtro-row">
        <select id="mesHistFiltro">
          <option value="">Todos</option>
          <option value="1">Janeiro</option><option value="2">Fevereiro</option>
          <option value="3">Março</option><option value="4">Abril</option>
          <option value="5">Maio</option><option value="6">Junho</option>
          <option value="7">Julho</option><option value="8">Agosto</option>
          <option value="9">Setembro</option><option value="10">Outubro</option>
          <option value="11">Novembro</option><option value="12">Dezembro</option>
        </select>
        <select id="anoHistFiltro">
          <option value="">Todos</option>
          <option value="2024">2024</option><option value="2025">2025</option><option value="2026">2026</option>
        </select>
        <button class="btn" id="btnFiltrarHistorico" style="width: auto; padding: 12px 16px;">Filtrar</button>
      </div>
      <div id="historico-lista"></div>
    </div>
  </div>

  <script>
    // Configurações do Airtable (salvas no localStorage)
    let AIRTABLE_API_KEY = localStorage.getItem('airtable_api_key') || '';
    let AIRTABLE_BASE_ID = localStorage.getItem('airtable_base_id') || '';
    let AIRTABLE_TABLE_NAME = localStorage.getItem('airtable_table_name') || 'Table 1';

    // URLs da API do Airtable
    function getAirtableUrl() {
      return `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${encodeURIComponent(AIRTABLE_TABLE_NAME)}`;
    }

    // Headers da requisição
    function getHeaders() {
      return {
        'Authorization': `Bearer ${AIRTABLE_API_KEY}`,
        'Content-Type': 'application/json'
      };
    }

    // Verifica se está configurado
    function isConfigured() {
      return AIRTABLE_API_KEY && AIRTABLE_BASE_ID && AIRTABLE_TABLE_NAME;
    }

    // Mostra tela de config se necessário
    function checkConfig() {
      if (!isConfigured()) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelector('.tab[data-screen="config"]').classList.add('active');
        document.getElementById('screen-config').classList.add('active');
        return false;
      }
      return true;
    }

    // Salvar configuração
    document.getElementById('btnSalvarConfig')?.addEventListener('click', () => {
      const apiKey = document.getElementById('apiKey').value.trim();
      const baseId = document.getElementById('baseId').value.trim();
      const tableName = document.getElementById('tableName').value.trim();
      
      if (!apiKey || !baseId || !tableName) {
        document.getElementById('config-mensagem').innerHTML = '<div class="error-msg">Preencha todos os campos!</div>';
        return;
      }
      
      localStorage.setItem('airtable_api_key', apiKey);
      localStorage.setItem('airtable_base_id', baseId);
      localStorage.setItem('airtable_table_name', tableName);
      
      AIRTABLE_API_KEY = apiKey;
      AIRTABLE_BASE_ID = baseId;
      AIRTABLE_TABLE_NAME = tableName;
      
      document.getElementById('config-mensagem').innerHTML = '<div class="success-msg">✅ Configuração salva! Recarregue o app.</div>';
      
      setTimeout(() => {
        window.location.reload();
      }, 1500);
    });

    // Carregar lançamentos do Airtable
    async function carregarLancamentos() {
      if (!checkConfig()) return [];
      
      try {
        const url = getAirtableUrl();
        const response = await fetch(url, { headers: getHeaders() });
        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error.message);
        }
        
        return data.records.map(record => ({
          id: record.id,
          data: record.fields.Data || "",
          descricao: record.fields.Descricao || "",
          categoria: record.fields.Categoria || "Outros",
          valor: record.fields.Valor || 0,
          responsavel: record.fields.Responsavel || "",
          conta: record.fields.Conta || "",
          forma_pagamento: record.fields.Forma_Pagamento || "",
          vencimento: record.fields.Vencimento || "",
          pago: record.fields.Pago || "Não",
          observacao: record.fields.Observacao || "",
          tipo: record.fields.Tipo || "Despesa"
        }));
        
      } catch (error) {
        console.error('Erro ao carregar:', error);
        throw error;
      }
    }

    // Salvar novo lançamento
    async function salvarLancamento(lancamento) {
      if (!checkConfig()) throw new Error('Configure o Airtable primeiro');
      
      const response = await fetch(getAirtableUrl(), {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify({
          records: [{
            fields: {
              Data: lancamento.data,
              Descricao: lancamento.descricao,
              Categoria: lancamento.categoria,
              Valor: lancamento.valor,
              Tipo: lancamento.tipo
            }
          }]
        })
      });
      
      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      return data;
    }

    // Atualizar saldo no header
    async function atualizarSaldo() {
      if (!isConfigured()) return;
      
      try {
        const lancamentos = await carregarLancamentos();
        const hoje = new Date();
        const mesAtual = hoje.getMonth() + 1;
        const anoAtual = hoje.getFullYear();
        
        let receitas = 0, despesas = 0;
        lancamentos.forEach(l => {
          const data = new Date(l.data);
          if (data.getMonth() + 1 === mesAtual && data.getFullYear() === anoAtual) {
            if (l.tipo === 'receita') receitas += l.valor;
            else despesas += l.valor;
          }
        });
        
        const saldo = receitas - despesas;
        document.getElementById('saldoHeaderValor').innerHTML = `R$ ${saldo.toFixed(2).replace('.', ',')}`;
        document.getElementById('saldoHeaderValor').style.color = saldo >= 0 ? '#2ecc71' : '#e74c3c';
      } catch (error) {
        console.error('Erro ao atualizar saldo:', error);
      }
    }

    // Carregar relatório
    async function carregarRelatorio() {
      if (!checkConfig()) return;
      
      const msgDiv = document.getElementById('relatorio-mensagem');
      msgDiv.innerHTML = '<div class="loading">Carregando...</div>';
      
      try {
        const lancamentos = await carregarLancamentos();
        const mes = parseInt(document.getElementById('mesFiltro').value);
        const ano = parseInt(document.getElementById('anoFiltro').value);
        
        const filtrados = lancamentos.filter(l => {
          const data = new Date(l.data);
          return data.getMonth() + 1 === mes && data.getFullYear() === ano;
        });
        
        let receitas = 0, despesas = 0;
        const porCategoria = {};
        
        filtrados.forEach(l => {
          if (l.tipo === 'receita') {
            receitas += l.valor;
          } else {
            despesas += l.valor;
            porCategoria[l.categoria] = (porCategoria[l.categoria] || 0) + l.valor;
          }
        });
        
        const saldo = receitas - despesas;
        
        document.getElementById('resumo-container').innerHTML = `
          <div class="resumo-cards">
            <div class="resumo-card receitas"><div class="resumo-valor" style="color:#2ecc71">R$ ${receitas.toFixed(2).replace('.',',')}</div><div>💰 Receitas</div></div>
            <div class="resumo-card despesas"><div class="resumo-valor" style="color:#e74c3c">R$ ${despesas.toFixed(2).replace('.',',')}</div><div>💸 Despesas</div></div>
            <div class="resumo-card saldo"><div class="resumo-valor" style="color:${saldo>=0?'#2ecc71':'#e74c3c'}">R$ ${saldo.toFixed(2).replace('.',',')}</div><div>📊 Saldo</div></div>
          </div>`;
        
        let catHtml = '';
        for (const [cat, val] of Object.entries(porCategoria)) {
          catHtml += `<div class="categoria-item"><span>${cat}</span><span style="color:#e74c3c">R$ ${val.toFixed(2).replace('.',',')}</span></div>`;
        }
        document.getElementById('categorias-container').innerHTML = catHtml || '<div style="text-align:center;color:#888;">Nenhuma despesa</div>';
        msgDiv.innerHTML = '';
        
      } catch (error) {
        msgDiv.innerHTML = `<div class="error-msg">❌ Erro: ${error.message}</div>`;
      }
    }

    // Carregar histórico
    async function carregarHistorico() {
      if (!checkConfig()) return;
      
      const msgDiv = document.getElementById('historico-mensagem');
      const listaDiv = document.getElementById('historico-lista');
      msgDiv.innerHTML = '<div class="loading">Carregando...</div>';
      
      try {
        let lancamentos = await carregarLancamentos();
        
        const mes = document.getElementById('mesHistFiltro').value;
        const ano = document.getElementById('anoHistFiltro').value;
        
        if (mes || ano) {
          lancamentos = lancamentos.filter(l => {
            const data = new Date(l.data);
            if (mes && data.getMonth() + 1 !== parseInt(mes)) return false;
            if (ano && data.getFullYear() !== parseInt(ano)) return false;
            return true;
          });
        }
        
        if (lancamentos.length === 0) {
          listaDiv.innerHTML = '<div style="text-align:center;padding:40px;color:#888;">Nenhum lançamento</div>';
          msgDiv.innerHTML = '';
          return;
        }
        
        lancamentos.reverse().forEach(l => {
          const valorFormat = `R$ ${l.valor.toFixed(2).replace('.', ',')}`;
          listaDiv.innerHTML += `
            <div class="lancamento-item">
              <div><div class="lancamento-descricao">${l.descricao}</div><div class="lancamento-data">${l.data} • ${l.categoria}</div></div>
              <div class="lancamento-valor ${l.tipo}">${l.tipo === 'receita' ? '+' : '-'} ${valorFormat}</div>
            </div>
          `;
        });
        
        msgDiv.innerHTML = '';
        
      } catch (error) {
        msgDiv.innerHTML = `<div class="error-msg">❌ Erro: ${error.message}</div>`;
      }
    }

    // Inicialização e eventos
    document.getElementById('data').value = new Date().toISOString().split('T')[0];
    
    document.getElementById('btnSalvar').onclick = async () => {
      const msgDiv = document.getElementById('lancar-mensagem');
      const descricao = document.getElementById('descricao').value.trim();
      const valor = parseFloat(document.getElementById('valor').value);
      
      if (!descricao) { msgDiv.innerHTML = '<div class="error-msg">Digite a descrição</div>'; return; }
      if (!valor || valor <= 0) { msgDiv.innerHTML = '<div class="error-msg">Digite um valor válido</div>'; return; }
      
      try {
        await salvarLancamento({
          data: document.getElementById('data').value,
          descricao: descricao,
          categoria: document.getElementById('categoria').value,
          valor: valor,
          tipo: document.querySelector('.tipo-btn.active').dataset.tipo
        });
        
        msgDiv.innerHTML = '<div class="success-msg">✅ Salvo com sucesso!</div>';
        document.getElementById('descricao').value = '';
        document.getElementById('valor').value = '';
        atualizarSaldo();
        
        setTimeout(() => msgDiv.innerHTML = '', 2000);
      } catch (error) {
        msgDiv.innerHTML = `<div class="error-msg">❌ Erro: ${error.message}</div>`;
      }
    };
    
    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        tab.classList.add('active');
        const screenId = tab.dataset.screen;
        document.getElementById(`screen-${screenId}`).classList.add('active');
        
        if (screenId === 'relatorio') carregarRelatorio();
        if (screenId === 'historico') {
          document.getElementById('historico-lista').innerHTML = '';
          carregarHistorico();
        }
      };
    });
    
    document.querySelectorAll('.tipo-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      };
    });
    
    document.getElementById('btnAtualizarRelatorio').onclick = carregarRelatorio;
    document.getElementById('btnFiltrarHistorico').onclick = () => {
      document.getElementById('historico-lista').innerHTML = '';
      carregarHistorico();
    };
    
    const hoje = new Date();
    document.getElementById('mesFiltro').value = hoje.getMonth() + 1;
    document.getElementById('anoFiltro').value = hoje.getFullYear();
    
    // Carrega dados se já configurado
    if (isConfigured()) {
      atualizarSaldo();
    }
  </script>
</body>
</html>
